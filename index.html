<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital Ghost Box Mobile</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background-color: #09090b; font-family: monospace; color: #a1a1aa; touch-action: manipulation; }
.amber-glow { text-shadow: 0 0 10px #f97316; }
.lcd-screen { background: #020617; border: 2px inset #1e293b; color: #4ade80; text-shadow: 0 0 5px #4ade80; }
</style>
</head>
<body class="p-4">
<div class="max-w-md mx-auto space-y-6">

<!-- Header -->
<div class="text-center">
<h1 class="text-2xl font-bold text-orange-500 amber-glow">GHOST BOX MOBILE</h1>
<p class="text-[10px] uppercase tracking-widest opacity-50">ITC Sweep Instrument</p>
</div>

<!-- VT Meter -->
<div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 shadow-2xl">
<div class="flex justify-between text-[10px] mb-1">
<span>TUNING VOLTAGE</span>
<span id="vt-display" class="text-orange-500 font-bold">0.0V</span>
</div>
<div class="w-full bg-black h-4 rounded-full overflow-hidden border border-zinc-700">
<div id="vt-bar" class="bg-orange-500 h-full transition-all duration-100" style="width: 0%"></div>
</div>
</div>

<!-- LCD Metadata Screen -->
<div class="lcd-screen p-4 rounded-lg h-32 text-xs overflow-hidden leading-tight">
<div id="terminal-out">> STANDBY...<br>> TAP START TO INITIALIZE</div>
</div>

<!-- Controls -->
<div class="grid grid-cols-2 gap-4">
<div class="bg-zinc-900 p-3 rounded border border-zinc-800">
<label class="text-[9px] block opacity-50">DWELL (MS)</label>
<input type="range" id="dwell-range" min="100" max="3000" value="1500" class="w-full accent-orange-500">
<div id="dwell-val" class="text-center text-xs">1500ms</div>
</div>
<div class="bg-zinc-900 p-3 rounded border border-zinc-800">
<label class="text-[9px] block opacity-50">ECHO BOX</label>
<input type="range" id="echo-range" min="0" max="90" value="30" class="w-full accent-orange-500">
<div id="echo-val" class="text-center text-xs">30%</div>
</div>
</div>

<!-- Start/Stop Button -->
<button id="power-btn" class="w-full py-6 bg-zinc-800 text-white font-bold rounded-2xl border-b-8 border-black active:border-b-0 active:translate-y-1 transition-all text-xl">
START ENGINE
</button>

</div>

<script>
let audioCtx, masterGain, echoNode, echoFeedback;
let isRunning = false;
let stations = [];
let currentIndex = 0;
let sweepTimer;

const terminal = document.getElementById('terminal-out');
const powerBtn = document.getElementById('power-btn');
const vtBar = document.getElementById('vt-bar');
const vtDisplay = document.getElementById('vt-display');

// Fetch stations from Public API
async function loadStations() {
try {
const response = await fetch('https://de1.api.radio-browser.info/json/stations/bytag/talk?limit=50');
stations = await response.json();
log(LOADED ${stations.length} STATIONS`);
} catch (e) {
log("ERROR LOADING STATIONS");
}
}

function log(msg) {
terminal.innerHTML = >${msg}<br>` + terminal.innerHTML;
}

function initAudio() {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
masterGain = audioCtx.createGain();

// Speech Filter
const filter = audioCtx.createBiquadFilter();
filter.type = 'bandpass';
filter.frequency.value = 1500;

// Echo Box
echoNode = audioCtx.createDelay();
echoNode.delayTime.value = 0.3;
echoFeedback = audioCtx.createGain();
echoFeedback.gain.value = 0.3;

masterGain.connect(filter);
filter.connect(echoNode);
echoNode.connect(echoFeedback);
echoFeedback.connect(echoNode);
echoNode.connect(audioCtx.destination);
}

async function playNext() {
if (!isRunning) return;

const station = stations[currentIndex];
const dwell = document.getElementById('dwell-range').value;

// Simulate VT Movement
const mockVT = (Math.random() * 8.2).toFixed(1);
vtDisplay.innerText = mockVT + "V";
vtBar.style.width = (mockVT / 8.2 * 100) + "%";

log(TUNING: ${station.name.substring(0, 15)}...);

const audio = new Audio(station.url);
audio.crossOrigin = "anonymous";
const source = audioCtx.createMediaElementSource(audio);
source.connect(masterGain);

audio.play().catch(() => log("STREAM SKIPPED"));

setTimeout(() => {
audio.pause();
audio.src = "";
audio.load();
currentIndex = (currentIndex + 1) % stations.length;
playNext();
}, dwell);
}

powerBtn.onclick = () => {
if (!audioCtx) initAudio();
if (audioCtx.state === 'suspended') audioCtx.resume();

isRunning = !isRunning;
if (isRunning) {
powerBtn.innerText = "STOP ENGINE";
powerBtn.classList.add('text-orange-500');
loadStations().then(playNext);
} else {
location.reload(); // Hard stop for mobile
}
};

// UI Updates
document.getElementById('dwell-range').oninput = (e) => document.getElementById('dwell-val').innerText = e.target.value + "ms";
document.getElementById('echo-range').oninput = (e) => {
if(echoFeedback) echoFeedback.gain.value = e.target.value / 100;
document.getElementById('echo-val').innerText = e.target.value + "%";
};
</script>
</body>
</html>
