<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #09090b; font-family: monospace; color: #a1a1aa; touch-action: manipulation; }
        .lcd { background: #020617; border: 2px inset #1e293b; color: #4ade80; text-shadow: 0 0 5px #4ade80; }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-orange-500 text-center">GHOST BOX</h1>

        <!-- Tuning Meter -->
        <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
            <div class="flex justify-between text-[10px] mb-1">
                <span>TUNING VOLTAGE</span>
                <span id="vt-display" class="text-orange-500 font-bold">0.0V</span>
            </div>
            <div class="w-full bg-black h-4 rounded-full border border-zinc-700">
                <div id="vt-bar" class="bg-orange-500 h-full transition-all" style="width: 0%"></div>
            </div>
        </div>

        <!-- LCD Screen -->
        <div id="status" class="lcd p-4 rounded-lg h-32 text-[10px] overflow-hidden">
            > SYSTEM READY...<br>> TAP START
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-4 text-center">
            <div class="bg-zinc-900 p-2 rounded border border-zinc-800">
                <label class="text-[9px] block opacity-50">SPEED</label>
                <input type="range" id="dwell" min="200" max="2000" value="800" class="w-full accent-orange-500">
            </div>
            <div class="bg-zinc-900 p-2 rounded border border-zinc-800">
                <label class="text-[9px] block opacity-50">ECHO</label>
                <input type="range" id="echo" min="0" max="80" value="30" class="w-full accent-orange-500">
            </div>
        </div>

        <!-- THE ONLY START BUTTON -->
        <button id="power-btn" class="w-full py-8 bg-zinc-800 text-white font-bold rounded-2xl border-b-8 border-black active:border-b-0 active:translate-y-1 text-xl">
            START ENGINE
        </button>
    </div>

    <script>
        let audioCtx, masterGain, echoNode, echoFeedback, isRunning = false, stations = [], currentIndex = 0;

        function log(msg) {
            const div = document.createElement('div');
            div.innerHTML = `> ${msg}`;
            const status = document.getElementById('status');
            status.prepend(div);
        }

        async function startSweep() {
            if (!isRunning || stations.length === 0) return;
            const s = stations[currentIndex];
            
            // UI Update
            const v = (Math.random() * 8.2).toFixed(1);
            document.getElementById('vt-display').innerText = v + "V";
            document.getElementById('vt-bar').style.width = (v / 8.2 * 100) + "%";
            log(`TUNING: ${s.name.substring(0,10)}`);

            const audio = new Audio(s.url);
            audio.crossOrigin = "anonymous";
            
            try {
                const source = audioCtx.createMediaElementSource(audio);
                source.connect(masterGain);
                await audio.play();
                setTimeout(() => {
                    audio.pause();
                    audio.src = "";
                    currentIndex = (currentIndex + 1) % stations.length;
                    startSweep();
                }, document.getElementById('dwell').value);
            } catch (e) {
                currentIndex = (currentIndex + 1) % stations.length;
                startSweep();
            }
        }

        document.getElementById('power-btn').onclick = async () => {
            if (!isRunning) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    masterGain = audioCtx.createGain();
                    echoNode = audioCtx.createDelay();
                    echoNode.delayTime.value = 0.2;
                    echoFeedback = audioCtx.createGain();
                    echoFeedback.gain.value = 0.3;
                    masterGain.connect(echoNode);
                    echoNode.connect(echoFeedback);
                    echoFeedback.connect(echoNode);
                    echoNode.connect(audioCtx.destination);
                }
                audioCtx.resume();
                isRunning = true;
                document.getElementById('power-btn').innerText = "STOP ENGINE";
                log("FETCHING STATIONS...");
                const res = await fetch('https://de1.api.radio-browser.info/json/stations/bytag/talk?limit=40&https=true');
                stations = await res.json();
                startSweep();
            } else {
                location.reload();
            }
        };

        document.getElementById('echo').oninput = (e) => {
            if(echoFeedback) echoFeedback.gain.value = e.target.value / 100;
        };
    </script>
</body>
</html>
